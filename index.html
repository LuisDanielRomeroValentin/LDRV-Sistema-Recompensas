<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Estrellas</title>
<meta name="theme-color" content="#583cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estrellas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<script>
/* ============ PON AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (termina en /exec) ============ */
const GAS_URL = "https://script.google.com/macros/s/AKfycby_6XCXXHYc-cA2k4qq3RoZURhMliNFe0AgQRad1BL5ItOSNFJvzW5eCuAJUsC-1ZMiyA/exec";
/* ================================================================================================ */
</script>
<style>
html,body{margin:0;height:100%;background:#583cff;font-family:system-ui,sans-serif}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 6px);width:100%;height:auto;border:0;background:#fff3c4}
#splash{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;
  background:linear-gradient(160deg,#583cff,#d646c8,#ff8c46);transition:opacity .4s}
#splash img{width:140px;height:140px;border-radius:32px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#splash p{font-size:20px;font-weight:700;margin:14px 0 0}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-192.png" alt=""><p id="msg">Cargando estrellas…</p></div></div>
<script>
const ok = /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[^\/]+\/exec/.test(GAS_URL);
if (!ok) {
  document.getElementById('msg').textContent = 'Falta poner la URL de Apps Script en index.html (variable GAS_URL).';
} else {
  const f = document.createElement('iframe');
  f.src = GAS_URL;
  f.allow = 'clipboard-write';
  f.onload = () => { const s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 450); };
  document.body.appendChild(f);
}
</script>
</body>
</html>
